hyper:
    batch_size: 16
    gpu_ids: 0
    logs_dir: ../full_mp/diff_crossattn
    results_dir: ../full_mp/diff_crossattn
    name: ./
    isTrain: True
    device: 'cuda'
    distributed: 0
    lr_init: 1e-4
    lr_step: [35000, 70000, 140000]
    lr_evo: [5e-5, 1e-5, 5e-6]
dataset:
    res: 64
    trunc_thres: 0.2
    ratio: 1

layout_branch:
    model: diffusion_scene_layout_ddpm
    angle_dim: 2
    denoiser: unet1d
    relation_condition: true
    denoiser_kwargs:
        dims: 1 # 1D
        in_channels: 8 # size(3)+loc(3)+sincos(2)
        out_channels: 8 # same
        model_channels: 512
        channel_mult: [ 1,1,1,1]
        num_res_blocks: 2
        attention_resolutions: [ 4, 2 ]
        num_heads: 8
        # cond_model params
        use_spatial_transformer: true
        transformer_depth: 1
        conditioning_key: 'crossattn'
        concat_dim: 1280
        crossattn_dim: 1280
        use_checkpoint: true
        enable_t_emb: true

    diffusion_kwargs:
      schedule_type: 'linear'
      beta_start: 0.0001
      beta_end: 0.02
      time_num: 1000
      model_mean_type: 'eps'
      model_var_type: 'fixedsmall'
      loss_separate: true
      loss_iou: false
      iou_type: obb
      train_stats_file: null
    inference_guidance:
      enabled: true
      interval: 5
      start_ratio: 0.95
      grad_clip: 10.1
      clip_to_bounds: true
      constraints:
        collision:
          enabled: true
          strength: 20.0
          weight: 10.0
          iou_threshold: 0.02
          penetration_threshold: 0.0
          iou_weight: 0.5
          penetration_weight: 2.0
          metric: aabb
          ignore_labels: ["scene", "floor"]
        room_outer:
          weight: 10.0
        walkable:
          enabled: true
          weight: 1.0 # Global scale factor for walkable guidance
          
          # Modular sub-components configured to match real_current_best behavior:
          components:
            center_penalty:
              enabled: true
              weight: 1
              sigma: 0.5
              
            pathfinding:
              enabled: false
              weight: 0.1
              robot_width_real: 0.5
              robot_hight_real: 1.5
              
            edge_gaussian:
              enabled: false
              weight: 1
              robot_width_real: 0.35
              robot_hight_real: 1.5
              sigma_scale: 0.5
              heatmap_weight: 0.8    # Component 1 (Floor Edge Heatmap)
              repulsion_weight: 0.2   # Component 2 (Pairwise Furniture Repulsion)
        relational:
          enabled: false
          weight: 10.0
          start_ratio: 0.5      # Custom start ratio for relational guidance (e.g., 0.5, 0.7, 0.95; defaults to global start_ratio if omitted)
          interval: 1           # Custom interval for relational guidance (e.g., 1=every step, 5=every 5th step; defaults to global interval if omitted)
          margin: 0.05
          close_threshold: 0.45
          stand_threshold: 0.04

shape_branch:
    model: sdfusion-txt2shape_mp
    sampling: greedy
    ckpt: null
    df_cfg: ../config/sdfusion-txt2shape_mp.yaml
    ddim_steps: 100
    ddim_eta: 0.0
    uc_scale: 3.0
    vq_model: vqvae
    vq_cfg: ../config/vqvae_snet.yaml
    vq_dset: None
    vq_cat: None
    vq_ckpt: ./checkpoint/vqvae_threedfront_best.pth
misc:
    debug: 0
    seed: 111
    backend: gloo
    local_rank: 0

training:
    lr: 1e-5
    lr_policy: lambda
    lr_decay_iters: 50
    lambda_L1: 10.0
